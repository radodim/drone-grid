# ============================================================
# compose.yaml — Production baseline
#
# Local dev overrides are in compose.override.yaml
# (automatically merged by Docker Compose)
#
# Usage:
#   Local dev:  docker compose up
#   Production: docker compose -f compose.yaml up -d
# ============================================================

services:
  # ============================================================
  # Database
  # ============================================================
  # TODO: Consider memory cap/shared memory limit (shm_size: 128mb)
  db:
    image: postgres:18.3
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql
      - ./config/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    env_file:
      - ./config/postgres/.env
    environment:
      # Secrets — resolved from host env vars in prod via Github secrets, fall back to dev defaults locally
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changethis}
      POSTGRES_BACKEND_PASSWORD: ${POSTGRES_BACKEND_PASSWORD:-changethis}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-changethis}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  # Identity (Keycloak)
  # ============================================================
  identity:
    image: quay.io/keycloak/keycloak:26.5
    command: start
    env_file:
      - ./config/keycloak/.env
    environment:
      # Secrets — resolved from host env vars in prod via Github secrets, fall back to dev defaults locally
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-changethis}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-changethis}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    labels:
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      # Only expose paths required for OIDC — /admin, /metrics, /health are blocked
      # See: https://www.keycloak.org/server/reverseproxy#_exposed_path_recommendations
      - traefik.http.routers.${STACK_NAME}-identity.rule=Host(`auth.${DOMAIN}`) && (PathPrefix(`/realms`) || PathPrefix(`/resources`) || PathPrefix(`/.well-known`))
      - traefik.http.routers.${STACK_NAME}-identity.entrypoints=http
      # HTTPS (ignored in dev — no https entrypoint defined)
      - traefik.http.routers.${STACK_NAME}-identity-secure.rule=Host(`auth.${DOMAIN}`) && (PathPrefix(`/realms`) || PathPrefix(`/resources`) || PathPrefix(`/.well-known`))
      - traefik.http.routers.${STACK_NAME}-identity-secure.entrypoints=https
      - traefik.http.routers.${STACK_NAME}-identity-secure.tls=true
      - traefik.http.routers.${STACK_NAME}-identity-secure.tls.certresolver=le
      # Shared service target
      - traefik.http.services.${STACK_NAME}-identity.loadbalancer.server.port=8080

  # ============================================================
  # Backend (FastAPI)
  # ============================================================
  backend:
    build:
      context: ./services/backend
    env_file:
      - .env
      - ./config/backend/.env
    environment:
      # Secrets — resolved from host env vars in prod via Github secrets, fall back to dev defaults locally
      POSTGRES_PASSWORD: ${POSTGRES_BACKEND_PASSWORD:-changethis} # maps to the backend DB user password, not the superuser
    depends_on:
      db:
        condition: service_healthy
      identity:
        condition: service_started
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      # HTTP
      - traefik.http.routers.${STACK_NAME}-backend.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.${STACK_NAME}-backend.entrypoints=http
      # HTTPS
      - traefik.http.routers.${STACK_NAME}-backend-secure.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.${STACK_NAME}-backend-secure.entrypoints=https
      - traefik.http.routers.${STACK_NAME}-backend-secure.tls=true
      - traefik.http.routers.${STACK_NAME}-backend-secure.tls.certresolver=le
      # Shared service target
      - traefik.http.services.${STACK_NAME}-backend.loadbalancer.server.port=8000

  # ============================================================
  # UI (Frontend)
  # ============================================================
  ui:
    build:
      context: ./services/ui
      args:
        # VITE_ vars are baked into static JS at build time (prod only, via bun run build).
        # Values come from .env (auto-loaded for YAML substitution).
        # These duplicate services/ui/.env because Vite reads that file directly in dev,
        # but Docker build args are the only way to inject them during the prod image build.
        VITE_API_URL: ${VITE_API_URL}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
        VITE_WEBRTC_URL: ${VITE_WEBRTC_URL}
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      # HTTP
      - traefik.http.routers.${STACK_NAME}-ui.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${STACK_NAME}-ui.entrypoints=http
      # HTTPS
      - traefik.http.routers.${STACK_NAME}-ui-secure.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${STACK_NAME}-ui-secure.entrypoints=https
      - traefik.http.routers.${STACK_NAME}-ui-secure.tls=true
      - traefik.http.routers.${STACK_NAME}-ui-secure.tls.certresolver=le
      # Shared service target
      - traefik.http.services.${STACK_NAME}-ui.loadbalancer.server.port=80

  # ============================================================
  # Streaming (MediaMTX)
  # ============================================================
  streaming:
    image: bluenviron/mediamtx:latest
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    environment:
      MTX_RTSPTRANSPORTS: tcp
    ports:
      - "8189:8189/udp" # WebRTC media (UDP, can't go through Traefik)
    volumes:
      - ./config/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    labels:
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      # RTSPS — Traefik terminates TLS on :443, forwards plain RTSP to MediaMTX
      - traefik.tcp.routers.${STACK_NAME}-rtsp.rule=HostSNI(`media.${DOMAIN}`)
      - traefik.tcp.routers.${STACK_NAME}-rtsp.entrypoints=https
      - traefik.tcp.routers.${STACK_NAME}-rtsp.tls=true
      - traefik.tcp.routers.${STACK_NAME}-rtsp.tls.certresolver=le
      - traefik.tcp.services.${STACK_NAME}-rtsp.loadbalancer.server.port=8554
      # WebRTC signaling (HTTP, port 8889)
      - traefik.http.routers.${STACK_NAME}-webrtc.rule=Host(`webrtc.${DOMAIN}`)
      - traefik.http.routers.${STACK_NAME}-webrtc.entrypoints=http
      - traefik.http.routers.${STACK_NAME}-webrtc.service=${STACK_NAME}-webrtc
      - traefik.http.services.${STACK_NAME}-webrtc.loadbalancer.server.port=8889
      # WebRTC signaling (HTTPS)
      - traefik.http.routers.${STACK_NAME}-webrtc-secure.rule=Host(`webrtc.${DOMAIN}`)
      - traefik.http.routers.${STACK_NAME}-webrtc-secure.entrypoints=https
      - traefik.http.routers.${STACK_NAME}-webrtc-secure.tls=true
      - traefik.http.routers.${STACK_NAME}-webrtc-secure.tls.certresolver=le
      - traefik.http.routers.${STACK_NAME}-webrtc-secure.service=${STACK_NAME}-webrtc

  # ============================================================
  # Proxy (Traefik) — HTTPS with Let's Encrypt
  # ============================================================
  proxy:
    image: traefik:v3
    restart: unless-stopped
    command:
      - --providers.docker
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443
      # HTTP -> HTTPS redirect
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      # Let's Encrypt
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=http
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/certificates

# ============================================================
# Volumes
# ============================================================
volumes:
  db-data:
  traefik-certificates:
