name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # NOT self-hosted — that runner is the production VPS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9
      - run: uv run --group docs zensical build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    # Pages can't be enabled while the repo is private on the free plan.
    # Go-live: Settings → Pages → Source = "GitHub Actions", then set the
    # repository variable DEPLOY_DOCS=true.
    if: vars.DEPLOY_DOCS == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
