# ============================================================
# compose.override.yaml — Local dev overrides
#
# Automatically merged by Docker Compose when running:
#   docker compose up
#
# Production skips this file by specifying only compose.yaml:
#   docker compose -f compose.yaml up -d
# ============================================================

services:
  identity:
    command: start-dev --import-realm
    volumes:
      - ./config/keycloak/${ENVIRONMENT}-realm.json:/opt/keycloak/data/import/realm.json:ro
    labels:
      # Override prod path restriction — allow all paths for admin console access in dev
      - traefik.http.routers.${STACK_NAME}-identity.rule=Host(`auth.${DOMAIN}`)

  backend:
    command: bash -c "/src/scripts/prestart.sh && fastapi dev --host 0.0.0.0 app/main.py"
    ports:
      - "8000:8000" # direct backend access for a LAN companion (Pi), bypassing Traefik
    volumes:
      - ./services/backend/app:/src/app

  ui:
    build:
      target: dev # stops at Vite stage, skips nginx
    volumes:
      - ./services/ui/src:/src/src
      - ./services/ui/index.html:/src/index.html
    labels:
      - traefik.http.services.${STACK_NAME}-ui.loadbalancer.server.port=5173

  messaging:
    ports:
      - "4222:4222" # NATS TCP

  streaming:
    ports:
      - "8554:8554" # RTSP direct (no TLS in dev)
      - "9997:9997" # MediaMTX API

  proxy:
    command:
      - --providers.docker
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --api.insecure=true
      - --accesslog
      - --log
    ports:
      - "80:80"
      - "8090:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
