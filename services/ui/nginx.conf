server {
  listen 80;

  location = / {
    root /usr/share/nginx/html;
    try_files /landing.html =404;
  }

  location = /terms {
    root /usr/share/nginx/html;
    try_files /terms.html =404;
  }

  location = /privacy {
    root /usr/share/nginx/html;
    try_files /privacy.html =404;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
